name: Run Laravel Unit Tests (SQLite in-memory)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpunit-tests:
    runs-on: ubuntu-latest

    steps:
      # Check code from the repository
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, pdo_sqlite, intl, xml, curl

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: ./backend

      - name: Copy .env
        run: cp .env.example .env
        working-directory: ./backend

      - name: Ensure .env.testing exists
        run: |
          if [ ! -f ./backend/.env.testing ]; then
            cp ./backend/.env.example ./backend/.env.testing
          fi

      - name: Generate application key
        run: php artisan key:generate
        working-directory: ./backend

      - name: Run migrations
        run: php artisan migrate --env=testing
        working-directory: ./backend

      - name: Run PHPUnit tests
        run: php artisan test --env=testing
        working-directory: ./backend
